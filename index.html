<!DOCTYPE html>
<html lang="en" class="light antialiased" data-viewport="scaled">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <!--
      title is the only tag here safe to leave alongside react-helmet-async's
      per-page tags -- the HTML spec treats <title> as a single unique slot,
      so Helmet reliably replaces it on mount with no duplicate.

      description/robots/canonical/og:*/twitter:* are deliberately NOT set
      here. react-helmet-async only manages tags it renders itself -- it has
      no awareness of tags baked into this static shell, so it ADDS its own
      instead of replacing them. Every route already sets its own complete
      Helmet block (see src/pages/*.tsx), so a static duplicate here doesn't
      add a fallback, it adds a second, conflicting tag with the same
      name/property that crawlers can pick over the correct per-page one
      (confirmed live: /apply was shipping both "index, follow" AND
      "noindex, nofollow" robots tags at once before this fix).
    -->
    <title>PRYME | Bank-Grade Intelligent Loan Matchmaking</title>
    <meta name="author" content="PRYME Intelligence" />

    <!--
      Favicons. There were none at all before this, which is why no brand mark
      appeared in a browser tab or in a search result for any of the three
      domains: a crawler has nothing to pick up if the page never declares one.

      Ordered widest-support-last on purpose. A browser takes the last icon it
      understands, so the SVG (sharp at every size, one file) wins in modern
      browsers, and the 96px PNG is what older Safari and Windows shortcuts fall
      back to. 48px is listed because that is the minimum Google states it will
      consider for search results.

      Served from the static shell rather than react-helmet-async: a crawler
      fetching the favicon does not execute React, so a per-page Helmet tag
      would be invisible to it. This is one of the few tags that belongs here.

      One build serves gopryme.tech, prymeloans.in and prymeloans.com, so all
      three pick these up with no per-brand step.
    -->
    <link rel="icon" href="/favicon-48.png" sizes="48x48" type="image/png" />
    <link rel="icon" href="/favicon-96.png" sizes="96x96" type="image/png" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" sizes="180x180" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="keywords" content="personal loan, business loan, home loan, loan aggregator, RBI compliant, secure loan, PRYME" />

    <!--
      connect-src lists the API host of EVERY brand this build is deployed to
      (gopryme.tech, prymeloans.in, prymeloans.com). This shell is static HTML,
      parsed before any script runs, so it cannot know which brand is serving it
      and must cover all of them. src/lib/api.ts still only ever calls the api
      host matching the current domain — this list is the ceiling, not the route.
      Adding a brand means adding its api.<brand> host here as well as to nginx's
      server_name and the backend's app.security.allowed-origins.

      The Meta Pixel needs three of these directives and fails silently without
      them -- the browser blocks the request and the console CSP violation is
      the only symptom, so the pixel simply reports nothing:
        script-src   https://connect.facebook.net  -- loads fbevents.js
        connect-src  https://www.facebook.com      -- where events are POSTed
        img-src      already permits https:        -- the <noscript> beacon
      If tracking ever goes quiet, check here before re-issuing the pixel ID.
    -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://static.cloudflareinsights.com https://accounts.google.com https://connect.facebook.net;
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://accounts.google.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https: http: blob:;
      media-src 'self' https://videos.pexels.com blob: data:;
      connect-src 'self' wss://* https://api.gopryme.tech https://api.prymeloans.in https://api.prymeloans.com https://*.amazonaws.com https://cloudflareinsights.com https://accounts.google.com https://www.facebook.com https://connect.facebook.net;
      worker-src 'self' blob:;
      frame-src 'self' https://accounts.google.com;
    ">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Resource hints for external image domains used on first paint -->
    <link rel="dns-prefetch" href="https://i.pravatar.cc" />
    <link rel="dns-prefetch" href="https://s2.googleusercontent.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://videos.pexels.com" />

    <!--
      FONT STRATEGY:
      - Inter: body text (sans-serif in tailwind.config.ts)
      - Space Grotesk: headings (display/heading in tailwind.config.ts)
      Both loaded from Google Fonts with font-display: swap (FOUT over FOIT).
    -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <!--
      Meta Pixel (base code), pixel ID 2097278684487779.

      Lives in this static shell rather than in a React component so that it is
      present in the prerendered HTML of every route -- scripts/prerender.js and
      scripts/inject-seo-head.js both only append at the end of the head, so
      this block survives the build and propagates to all three brand domains
      from the one build, exactly like the favicons above.

      Do NOT write the closing-head tag literally anywhere in this file's
      comments. inject-seo-head.js locates its insertion point by searching for
      that exact string, so a copy of it inside a comment becomes the match and
      the canonical link plus the Organization JSON-LD get injected INTO the
      comment, where they are inert. That shipped once: every route went live
      with no canonical and no schema, and nothing failed loudly. The injector
      now anchors on the LAST occurrence, so this is belt and braces.

      KNOWN LIMITATION -- this fires PageView ONCE, on initial document load.
      PRYME is a client-routed SPA (react-router), so moving between routes does
      NOT re-fire it: Meta will attribute every visit to the first URL loaded and
      report no funnel beyond it. Fixing that needs an fbq('track','PageView')
      on route change from inside the router, which is a separate change to
      src/ and is deliberately not done here.
    -->
    <script>
      !function(f,b,e,v,n,t,s)
      {if(f.fbq)return;n=f.fbq=function(){n.callMethod?
      n.callMethod.apply(n,arguments):n.queue.push(arguments)};
      if(!f._fbq)f._fbq=n;n.push=n;n.loaded=!0;n.version='2.0';
      n.queue=[];t=b.createElement(e);t.async=!0;
      t.src=v;s=b.getElementsByTagName(e)[0];
      s.parentNode.insertBefore(t,s)}(window, document,'script',
      'https://connect.facebook.net/en_US/fbevents.js');
      fbq('init', '2097278684487779');
      fbq('track', 'PageView');
    </script>
    <!--
      Meta's snippet also carries a <noscript><img> beacon. It is NOT here,
      because an <img> inside a <noscript> that sits in <head> is invalid HTML --
      only <link>, <style> and <meta> are allowed there. Vite parses index.html
      with parse5 and hard-fails the build on it
      (disallowed-content-in-noscript-in-head). It lives in <body> instead,
      next to the existing no-JS banner, which is where the spec allows it.
    -->
    <!-- End Meta Pixel Code -->

  </head>

  <body class="bg-[#0a0a0a] text-white overflow-x-hidden">
    
    <noscript>
      <div style="padding: 2rem; text-align: center; background: #111; color: #fff; font-family: sans-serif; border-bottom: 2px solid #ef4444;">
        ⚠️ <strong>JavaScript is required.</strong> Please enable JavaScript to access the PRYME secure portal.
      </div>
    </noscript>

    <!--
      Meta Pixel no-script fallback (see the head block for the main snippet).
      In <body> because it is invalid inside a <head> <noscript> and breaks the
      Vite build there. Note this can only ever record a bounce: the banner
      above says the portal does not work without JavaScript, so a visitor who
      trips this beacon cannot proceed. Kept because Meta's setup checker looks
      for it and it costs nothing.
    -->
    <noscript><img height="1" width="1" style="display:none"
      src="https://www.facebook.com/tr?id=2097278684487779&ev=PageView&noscript=1"
      alt="" /></noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
