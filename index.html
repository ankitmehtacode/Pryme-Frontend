<!DOCTYPE html>
<html lang="en" class="antialiased">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
    <meta name="theme-color" content="#0a0a0a" />

    <title>PRYME | Bank-Grade Intelligent Loan Matchmaking</title>
    <meta name="description" content="Experience transparent loan processing with 256-bit bank-grade security. Instant pre-approved limits from top-tier RBI compliant banks." />
    <meta name="author" content="PRYME Intelligence" />
    <meta name="keywords" content="personal loan, business loan, home loan, loan aggregator, RBI compliant, secure loan, PRYME" />
    <meta name="robots" content="index, follow, max-image-preview:large, max-snippet:-1, max-video-preview:-1" />

    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval';
      style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
      font-src 'self' https://fonts.gstatic.com data:;
      img-src 'self' data: https: http: blob:;
      media-src 'self' https://videos.pexels.com blob: data:;
      connect-src 'self' http://localhost:8080 ws://localhost:* wss://* https://api.gopryme.tech;
      worker-src 'self' blob:;
    ">

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- Resource hints for external image domains used on first paint -->
    <link rel="dns-prefetch" href="https://i.pravatar.cc" />
    <link rel="dns-prefetch" href="https://s2.googleusercontent.com" />
    <link rel="dns-prefetch" href="https://images.unsplash.com" />
    <link rel="dns-prefetch" href="https://videos.pexels.com" />

    <!--
      FONT STRATEGY:
      - Inter: body text (sans-serif in tailwind.config.ts)
      - Space Grotesk: display headings (display font in tailwind.config.ts + h1/h2/h3 in index.css)
      - Playfair Display removed — it was never referenced in the design system.
      - JetBrains Mono NOT loaded here — only used in code blocks; browser falls back to Menlo fine.
      - display=swap prevents blank text during font download (FOUT over FOIT).
    -->
    <link rel="preload" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" as="style" />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />

    <!-- LCP Asset Preloading (Vite resolves these to hashed URLs on build) -->
    <link rel="preload" href="/src/assets/Pryme2.svg" as="image" type="image/svg+xml" crossorigin="anonymous" />
    <link rel="preload" href="/src/assets/pryme-wordmark.svg" as="image" type="image/svg+xml" crossorigin="anonymous" />

    <link rel="canonical" href="https://www.gopryme.tech" />

    <meta property="og:title" content="PRYME - Secure Loan Matchmaking" />
    <meta property="og:description" content="Enter your details once. Let our algorithm scan 15+ top-tier banks to fetch your pre-approved limits." />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://www.gopryme.tech" />
    <meta property="og:site_name" content="PRYME" />
    <meta property="og:image" content="https://www.gopryme.tech/Pryme2.svg" />

    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="PRYME - Secure Loan Matchmaking" />
    <meta name="twitter:description" content="Bank-grade security for your financial future. Apply online instantly." />
    <meta name="twitter:image" content="https://www.gopryme.tech/Pryme2.svg" />
  </head>

  <body class="bg-[#0a0a0a] text-white overflow-x-hidden">
    
    <noscript>
      <div style="padding: 2rem; text-align: center; background: #111; color: #fff; font-family: sans-serif; border-bottom: 2px solid #ef4444;">
        ⚠️ <strong>JavaScript is required.</strong> Please enable JavaScript to access the PRYME secure portal.
      </div>
    </noscript>

    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
