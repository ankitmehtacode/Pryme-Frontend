<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 280 60">
  <defs>
    <!-- Organic curved leaf shape -->
    <path id="petal" d="M 0,0 C -4,-12 -2,-20 8,-22 C 10,-16 6,-6 0,0 Z" />
  </defs>
  <g transform="translate(10, 8)">
    <!-- Sunburst Icon Group -->
    <g transform="translate(20, 22)">
      <!-- Outer red petals -->
      <use href="#petal" transform="rotate(0) scale(1.1)" fill="#7C1A22" />
      <use href="#petal" transform="rotate(36) scale(1.1)" fill="#7C1A22" />
      <use href="#petal" transform="rotate(72) scale(1.1)" fill="#7C1A22" />
      <use href="#petal" transform="rotate(108) scale(1.1)" fill="#7C1A22" />
      <use href="#petal" transform="rotate(144) scale(1.1)" fill="#7C1A22" />
      <use href="#petal" transform="rotate(180) scale(1.1)" fill="#7C1A22" />
      <use href="#petal" transform="rotate(216) scale(1.1)" fill="#7C1A22" />
      <use href="#petal" transform="rotate(252) scale(1.1)" fill="#7C1A22" />
      <use href="#petal" transform="rotate(288) scale(1.1)" fill="#7C1A22" />
      <use href="#petal" transform="rotate(324) scale(1.1)" fill="#7C1A22" />

      <!-- Inner orange petals (interleaved rotation) -->
      <use href="#petal" transform="rotate(18) scale(0.85)" fill="#E87722" />
      <use href="#petal" transform="rotate(54) scale(0.85)" fill="#E87722" />
      <use href="#petal" transform="rotate(90) scale(0.85)" fill="#E87722" />
      <use href="#petal" transform="rotate(126) scale(0.85)" fill="#E87722" />
      <use href="#petal" transform="rotate(162) scale(0.85)" fill="#E87722" />
      <use href="#petal" transform="rotate(198) scale(0.85)" fill="#E87722" />
      <use href="#petal" transform="rotate(234) scale(0.85)" fill="#E87722" />
      <use href="#petal" transform="rotate(270) scale(0.85)" fill="#E87722" />
      <use href="#petal" transform="rotate(306) scale(0.85)" fill="#E87722" />
      <use href="#petal" transform="rotate(342) scale(0.85)" fill="#E87722" />

      <!-- Central sun -->
      <circle cx="0" cy="0" r="7" fill="#F1B923" />
    </g>

    <!-- Text -->
    <text x="52" y="21" font-family="'Inter', sans-serif" font-weight="900" font-size="14" fill="#7C1A22" letter-spacing="0.5">ADITYA BIRLA</text>
    <text x="52" y="36" font-family="'Inter', sans-serif" font-weight="700" font-size="11" fill="#E87722" letter-spacing="1.5">FINANCE</text>
  </g>
</svg>
